<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NOVA RUSH</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #game { width: 100%; height: 100%; }
  /* touch controls (input.js), shown by the HUD during play on a touch screen */
  #touch { position: fixed; inset: 0; display: none; font: 900 12px/1 Montserrat, "Segoe UI", Arial, sans-serif; letter-spacing: 2px; }
  #touch.on { display: block; }
  .stick { position: absolute; width: 120px; height: 120px; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none;
    border: 2px solid rgba(0, 229, 255, .4); box-shadow: 0 0 14px rgba(0, 229, 255, .25), inset 0 0 14px rgba(0, 229, 255, .15); opacity: .3; }
  .stick.held { opacity: 1; }
  .stick i { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -27px; border-radius: 50%;
    background: rgba(0, 229, 255, .2); border: 2px solid rgba(0, 229, 255, .85); box-shadow: 0 0 12px rgba(0, 229, 255, .5); }
  #stickL { left: 15%; top: 72%; }
  #stickR { left: 85%; top: 72%; }
  #touch button { position: absolute; width: 64px; height: 64px; padding: 0; border-radius: 50%; font: inherit; color: #e6fdff;
    background: rgba(0, 229, 255, .08); border: 2px solid rgba(0, 229, 255, .6); box-shadow: 0 0 12px rgba(0, 229, 255, .35); }
  #touch [data-btn=lb] { right: 20px; bottom: 170px; }
  #touch [data-btn=rb] { right: 100px; bottom: 215px; color: #fff6d0; background: rgba(255, 210, 61, .08);
    border-color: rgba(255, 210, 61, .7); box-shadow: 0 0 12px rgba(255, 210, 61, .35); }
  #touch [data-btn=start] { right: 12px; top: 12px; width: 44px; height: 44px; letter-spacing: 1px; }
  #rotate { display: none; }
  @media (orientation: portrait) and (pointer: coarse) {
    #rotate { display: flex; position: fixed; inset: 0; align-items: center; justify-content: center; background: #05060d; color: #e6fdff;
      font: 900 18px Montserrat, "Segoe UI", Arial, sans-serif; letter-spacing: 4px; text-shadow: 0 0 12px #00e5ff; }
  }
</style>
</head>
<body>
<div id="game"></div>
<div id="touch">
  <div class="stick" id="stickL"><i></i></div><div class="stick" id="stickR"><i></i></div>
  <button data-btn="lb">DASH</button><button data-btn="rb">BOMB</button><button data-btn="start">II</button>
</div>
<div id="rotate">ROTATE YOUR DEVICE</div>
<script src="lib/phaser.min.js"></script>
<script src="src/config.js"></script>
<script src="src/audio.js"></script>
<script src="src/music.js"></script>
<script src="src/input.js"></script>
<script src="src/fx.js"></script>
<script src="src/space.js"></script>
<script src="src/enemies.js"></script>
<script src="src/pickups.js"></script>
<script src="src/upgrades.js"></script>
<script src="src/ui.js"></script>
<script src="src/game.js"></script>
<script src="src/main.js"></script>
</body>
</html>
